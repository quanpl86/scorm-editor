# Ví dụ input cho AI Agent sinh quiz TSV
# Caller có thể gửi YAML/JSON tương đương trong user prompt.

learning_objectives:
  - id: LO1
    text: "Học viên nhận diện và gọi đúng tên các thành phần giao diện viewport 3D."
    bloom_hint: remember
  - id: LO2
    text: "Học viên giải thích sự khác nhau giữa mesh và object trong mô hình 3D."
    bloom_hint: understand
  - id: LO3
    text: "Học viên thực hiện đúng thứ tự các bước mở file, chọn góc nhìn và quan sát chi tiết mesh."
    bloom_hint: apply
  - id: LO4
    text: "Học viên phát hiện lỗi quan sát (góc nhìn sai, bỏ sót chi tiết) trong tình huống mẫu."
    bloom_hint: analyze

lesson_info:
  course_code: "DGSA"
  module_code: "HP05"
  lesson_code: "B01"
  title: "Thế giới 3D diệu kỳ"
  subject: "Thiết kế 3D"
  level: "Level 5"
  duration_minutes: 90
  key_concepts:
    - viewport
    - mesh
    - object
    - polygon
    - orbit / zoom
  prerequisites:
    - "Biết thao tác chuột cơ bản trên máy tính"

project_instruction: |
  Học viên quan sát một mô hình 3D mẫu, chụp 2 góc nhìn (front và perspective),
  ghi chú ít nhất 3 chi tiết mesh và nộp kèm screenshot đúng yêu cầu đặt tên file.
  Tiêu chí: đúng góc nhìn, ảnh rõ, ghi chú đúng thuật ngữ bài học.

quiz_overrides:
  quiz_scope: lesson
  total_questions: 10
  total_points: 14
  # text_first | paths_placeholder | rich_urls
  # text_first: AI điền đủ text, để trống cột ảnh — human gắn media/* sau khi import Excel
  media_policy: text_first
  language: vi
  allowed_types:
    - MC
    - MR
    - TF
    - MG
    - SEQ
    - FIB
    - TI
    - NUM
    - MNUM
  attempt_limit: 3
  # duration_seconds: 1200  # optional; agent tự tính nếu bỏ
  # video_urls / audio_urls: chỉ YouTube|Vimeo / HTTPS trực tiếp nếu có trong brief
